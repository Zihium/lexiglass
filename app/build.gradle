plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lexi.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lexi.reader'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            // 前端 H5 直接作为 assets 打进 APK，由 WebView 通过 file:///android_asset/web/ 加载
            assets.srcDirs = ['assets']
        }
    }
}
